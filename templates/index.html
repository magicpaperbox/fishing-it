<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fiszki</title>
    <link rel="icon" type="image/png" sizes="1254x1254" href="{{ url_for('static', filename='icon_fish.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon_fish.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <meta name="theme-color" content="#ffd6e8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="home-page">
    <header class="home-header">
        <a href="/" class="logo" aria-label="FishingIT - strona glowna">
            <img class="logo-image" src="{{ url_for('static', filename='fishing_it.png') }}" alt="FishingIT">
        </a>
    </header>

    <section class="home-content">
        <section class="deck-panel" aria-labelledby="deck-list-title">
            <div class="deck-panel-header">
                <div>
                    <p class="deck-panel-kicker">Biblioteka</p>
                    <h2 id="deck-list-title" class="page-title">Zestawy fiszek</h2>
                </div>
                <span class="deck-count">{{ decks | length }}</span>
            </div>

            <div id="deck-search-root">

            </div>
        </section>
    </section>
</main>
<script id="decks-data" type="application/json">
    {{ decks_json | tojson }}
</script>
<script type="module" src="http://localhost:5173/@vite/client"></script>

<script type="module" src="http://localhost:5173/frontend/main.tsx"></script>
</body>
</html>
