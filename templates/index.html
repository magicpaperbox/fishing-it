<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fiszki</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
    <a href="/" class="logo">FishingIT</a>
    <h2 class="page-title">Zestawy fiszek</h2>

    <ul class="deck-list">
        {% for deck in decks %}
            <li class="deck-list-item">
                <a class="deck-link" href="/decks/{{ deck.id }}">
                    {{ deck.name }}
                </a>
                <form
                    class="delete-deck-form"
                    method="post"
                    action="{{ url_for('main.delete_deck', deck_id=deck.id) }}"
                    onsubmit="return confirm('Czy na pewno chcesz usun\u0105\u0107 ten zestaw fiszek?');"
                >
                    <button class="delete-deck-button" type="submit" aria-label="Usu&#324; zestaw" title="Usu&#324; zestaw">
                        <svg class="delete-deck-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4h8v2"></path>
                            <path d="M6 6l1 15h10l1-15"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                        </svg>
                    </button>
                </form>
            </li>
        {% endfor %}
    </ul>

</main>
</body>
</html>
