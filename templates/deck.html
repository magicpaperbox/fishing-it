<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FishingIT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
    <a href="/" class="logo">FishingIT</a>

    <section id="study-start">
        <button id="start-from-scratch">Start from scratch</button>
        <button id="resume-study">Continue study</button>
    </section>

    <section class="card hidden">
        <p id="category"></p>
        <div id="question" role="heading" aria-level="2"></div>
        <div id="answer" class="hidden"></div>
    </section>
    <p id="study-progress" class="hidden"></p>
    <button id="show-answer" class="hidden">Poka&#380; odpowied&#378;</button>
    <div class="card-actions">
        <button id="next-card" class="hidden">Nast&#281;pna</button>
        <button id="mastered" class="hidden">Umiem</button>
        <button id="needs-practice" class="hidden">Nie umiem</button>
    </div>

    <section id="summary" class="hidden">
        <h2>Podsumowanie</h2>
        <div id="summary-chart"></div>
        <div class="chart-legend">
            <span><b class="mastered-dot"></b> Umiem</span>
            <span><b class="needs-practice-dot"></b> Nie umiem</span>
            <span><b class="not-done-dot"></b> Nie przerobione</span>
        </div>
        <button id="continue-study">Ucz się dalej</button>
        <button id="reset-progress">Resetuj postęp</button>

        <p id="mastered-count"></p>
        <p id="needs-practice-count"></p>
        <p id="not-done-count"></p>
    </section>
</main>

<script>
    const flashcards = {{ flashcards | tojson }};
    const deckId = {{ deck_id | tojson }};
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
