<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Fiszki</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
<h1>Zestawy fiszek</h1>

<ul>
    {% for deck in decks %}
        <li>
            <a href="/decks/{{ deck.id }}">
                {{ deck.name }}
            </a>
        </li>
    {% endfor %}
</ul>

</main>
</body>
</html>
