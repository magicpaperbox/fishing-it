<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FishingIT</title>
    <link rel="icon" type="image/png" sizes="1254x1254" href="{{ url_for('static', filename='icon_fish.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon_fish.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <meta name="theme-color" content="#ffd6e8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="study-page">
    <header class="study-header">
        <a href="/" class="logo" aria-label="FishingIT - strona glowna">
            <img class="logo-image" src="{{ url_for('static', filename='fishing_it.png') }}" alt="FishingIT">
        </a>
    </header>

    <section id="study-start" class="study-start-panel" aria-labelledby="study-start-title">
        <div class="study-start-header">
            <p class="study-start-kicker">Sesja fiszek</p>
            <h1 id="study-start-title" class="study-start-title">Wybierz tryb nauki</h1>
        </div>
        <div class="study-start-actions">
            <button id="start-from-scratch" type="button">
                <span class="study-action-label">Od nowa</span>
                <span class="study-action-detail">ca&#322;y zestaw</span>
            </button>
            <button id="resume-study" type="button">
                <span class="study-action-label">Kontynuuj</span>
                <span class="study-action-detail">do powt&#243;rki</span>
            </button>
        </div>
    </section>

    <section class="card hidden">
        <p id="category"></p>
        <div id="question" role="heading" aria-level="2"></div>
        <div id="answer" class="hidden"></div>
    </section>
    <p id="study-progress" class="hidden"></p>
    <button id="show-answer" class="hidden">Poka&#380; odpowied&#378;</button>
    <div class="card-actions">
        <button id="next-card" class="hidden">Nast&#281;pna</button>
        <button id="mastered" class="hidden">Umiem</button>
        <button id="needs-practice" class="hidden">Nie umiem</button>
    </div>

    <section id="summary" class="hidden">
        <h2>Podsumowanie</h2>
        <div id="summary-chart"></div>
        <div class="chart-legend">
            <span><b class="mastered-dot"></b> Umiem</span>
            <span><b class="needs-practice-dot"></b> Nie umiem</span>
            <span><b class="not-done-dot"></b> Nie przerobione</span>
        </div>
        <button id="continue-study">Ucz si&#281; dalej</button>
        <button id="reset-progress">Resetuj post&#281;p</button>

        <p id="mastered-count"></p>
        <p id="needs-practice-count"></p>
        <p id="not-done-count"></p>
    </section>
</main>

<script>
    const flashcards = {{ flashcards | tojson }};
    const deckId = {{ deck_id | tojson }};
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
