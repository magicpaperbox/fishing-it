<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fiszki</title>
    <link rel="icon" type="image/png" sizes="1254x1254" href="{{ url_for('static', filename='icon_fish.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon_fish.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <meta name="theme-color" content="#ffd6e8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="home-page">
    <header class="home-header">
        <a href="/" class="logo" aria-label="FishingIT - strona glowna">
            <img class="logo-image" src="{{ url_for('static', filename='fishing_it.png') }}" alt="FishingIT">
        </a>
    </header>

    <section class="home-content">
        <section class="deck-panel" aria-labelledby="deck-list-title">
            <div class="deck-panel-header">
                <div>
                    <p class="deck-panel-kicker">Biblioteka</p>
                    <h2 id="deck-list-title" class="page-title">Zestawy fiszek</h2>
                </div>
                <span class="deck-count">{{ decks | length }}</span>
            </div>

            <ul class="deck-list">
                {% for deck in decks %}
                    <li class="deck-list-item">
                        <a class="deck-link" href="/decks/{{ deck.id }}">
                            <span class="deck-card-icon" aria-hidden="true">{{ deck.name[:1] | upper }}</span>
                            <span class="deck-name">{{ deck.name }}</span>
                        </a>
                        <form
                            class="delete-deck-form"
                            method="post"
                            action="{{ url_for('main.delete_deck', deck_id=deck.id) }}"
                            onsubmit="return confirm('Czy na pewno chcesz usun\u0105\u0107 ten zestaw fiszek?');"
                        >
                            <button class="delete-deck-button" type="submit" aria-label="Usun zestaw" title="Usun zestaw">
                                <svg class="delete-deck-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                                    <path d="M3 6h18"></path>
                                    <path d="M8 6V4h8v2"></path>
                                    <path d="M6 6l1 15h10l1-15"></path>
                                    <path d="M10 11v6"></path>
                                    <path d="M14 11v6"></path>
                                </svg>
                            </button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        </section>
    </section>
</main>
</body>
</html>
