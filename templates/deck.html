<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>FishingIT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
    <a href="/" class="logo">FishingIT</a>

    <section class="card">
        <p id="category"></p>
        <h2 id="question"></h2>
        <p id="answer" class="hidden"></p>
    </section>

    <button id="show-answer">Poka&#380; odpowied&#378;</button>
    <div class="card-actions">
        <button id="next-card">Nast&#281;pna</button>
        <button id="known">Umiem</button>
        <button id="unknown">Nie umiem</button>
    </div>

    <section id="summary" class="hidden">
        <h2>Podsumowanie</h2>
        <div id="summary-chart"></div>
        <div class="chart-legend">
            <span><b class="known-dot"></b> Umiem</span>
            <span><b class="unknown-dot"></b> Nie umiem</span>
            <span><b class="not-done-dot"></b> Nie przerobione</span>
        </div>
        <button id="restart">Ucz się dalej</button>
        <button id="reset-cards">Resetuj fiszki</button>

        <p id="known-count"></p>
        <p id="unknown-count"></p>
        <p id="not-done-count"></p>
    </section>
</main>

<script>
    const flashcards = {{ flashcards | tojson }};
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
